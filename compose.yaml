services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: 1000
        GID: 1000
    image: job-attendance-app:latest
    container_name: job_attendance_app
    restart: unless-stopped
    userns_mode: "keep-id"
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
      - "5173:5173"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
    volumes:
      - .:/var/www/html:z
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro,z
    networks:
      - job-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000 & php artisan queue:work & npm run dev"

  postgres:
    image: docker.io/postgis/postgis:17-master
    container_name: job_attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-job_attendance}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    networks:
      - job-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-job_attendance}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    container_name: job_attendance_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data:Z
    networks:
      - job-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  job-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
